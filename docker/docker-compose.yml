services:
  bbw-mariadb-trips-dev:
    image: mariadb
    container_name: bbw-mariadb-trips-dev
    environment:
      - MYSQL_ROOT_PASSWORD=bbw123
      - MYSQL_DATABASE=db_biztrips
    ports:
      - "3306:3306"
    volumes:
      - ./database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -pbbw123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bbw-phpmyadmin-trips:
    depends_on:
      - bbw-mariadb-trips-dev
    image: phpmyadmin/phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: bbw-mariadb-trips-dev

  # EX-02/EX-04: Backend als Container mit persistentem Upload-Volume.
  # Start: docker compose -f docker/docker-compose.yml --profile app up -d --build
  biztrips-backend:
    profiles: ["app"]
    build:
      context: ..
    image: biztrips-backend:local
    depends_on:
      bbw-mariadb-trips-dev:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      SPRING_DATASOURCE_URL: jdbc:mariadb://bbw-mariadb-trips-dev:3306/db_biztrips
      APP_STORAGE_LOCATION: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - biztrips-uploads:/app/uploads

volumes:
  biztrips-uploads:
    name: biztrips-uploads
