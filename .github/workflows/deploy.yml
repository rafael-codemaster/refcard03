name: CI/CD Backend – Test, Build & Deploy

# Ablauf:  test -> build -> deploy (EC2) -> docker (Docker Hub) -> deploy-ecs (ECR + ECS Fargate)
# Die drei Deploy-Stufen werden über Repository-Variables einzeln aktiviert
# (DEPLOY_EC2, PUSH_DOCKERHUB, DEPLOY_ECS = 'true'), siehe docs/loesung/README.md.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: biztrips-backend
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECS_CLUSTER: biztrips-backend-cluster
  ECS_SERVICE: biztrips-backend-service
  ECS_CONTAINER: biztrips-backend
  ECS_DESIRED_COUNT: 2

jobs:
  test:
    name: Tests (JUnit, H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Tests ausführen
        run: ./mvnw -B test

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Jar bauen
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Jar bauen
        run: ./mvnw -B clean package -DskipTests

      - name: Jar als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- EX-01
  deploy:
    name: Deploy auf AWS EC2 (systemd)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_EC2 == 'true'
    environment: production
    timeout-minutes: 10
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Jar-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: SSH-Key einrichten
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          for v in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v fehlt im Environment 'production' (Settings -> Environments -> production)."
              exit 1
            fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          KEYS=$(ssh-keyscan -T 15 -H "$EC2_HOST" 2>/dev/null || true)
          if [ -z "$KEYS" ]; then
            echo "::error::$EC2_HOST ist per SSH nicht erreichbar. Läuft die Instanz? Hat sich die Public-DNS nach einem Lab-Neustart geändert? Ist Port 22 offen?"
            exit 1
          fi
          echo "$KEYS" >> ~/.ssh/known_hosts

      - name: Jar per rsync übertragen
        run: |
          JAR=$(ls dist/*.jar | head -n 1)
          rsync -az -e "ssh -i $HOME/.ssh/deploy_key" "$JAR" "$EC2_USER@$EC2_HOST:/opt/businesstrips/app.jar"

      - name: Service neu starten
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "echo APP_VERSION=$GITHUB_SHA > /opt/businesstrips/version.env && sudo systemctl restart businesstrips.service"

      - name: Health-Check nach Deploy
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "http://$EC2_HOST:8080/actuator/info" 2>/dev/null | grep -q "$GITHUB_SHA" \
               && curl -fsS "http://$EC2_HOST:8080/actuator/health" | grep -q '"status":"UP"'; then
              echo "Version $GITHUB_SHA läuft und ist gesund."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Neue Version ist nach 3 Minuten nicht gesund. Letzte Service-Logs:"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "sudo journalctl -u businesstrips.service -n 60 --no-pager" || true
          exit 1

      - name: Zusammenfassung
        run: |
          echo "### EC2-Deploy erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$GITHUB_SHA\` läuft als systemd-Service auf der EC2-Instanz (Port 8080)." >> "$GITHUB_STEP_SUMMARY"

      - name: SSH-Key entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ---------------------------------------------------------------- EX-02
  docker:
    name: Image -> Docker Hub
    runs-on: ubuntu-latest
    needs: [build, deploy]
    # Nur main (bzw. Release-Tags v*.*.*), nie bei Pull Requests
    if: >-
      always()
      && needs.build.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.deploy.result)
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && vars.PUSH_DOCKERHUB == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod01,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=sha,prefix=,format=long

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- EX-03
  deploy-ecs:
    name: Image -> ECR + Deploy ECS (Fargate)
    runs-on: ubuntu-latest
    needs: [build, deploy, docker]
    if: >-
      always()
      && needs.build.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.deploy.result)
      && contains(fromJSON('["success","skipped"]'), needs.docker.result)
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && vars.DEPLOY_ECS == 'true'
    environment:
      name: aws-ecs
      url: http://${{ vars.ALB_DNS }}/actuator/info
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguration prüfen
        env:
          RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
          DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
          HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SESSION_TOKEN != '' }}
        run: |
          missing=0
          for v in RDS_ENDPOINT DB_SECRET_ARN; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository-Variable $v fehlt. Wert wird von scripts/aws-ecs-setup.sh ausgegeben."
              missing=1
            fi
          done
          if [ "$HAS_AWS_KEYS" != "true" ]; then
            echo "::error::Secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN fehlen (Learner Lab -> AWS Details -> AWS CLI)."
            missing=1
          fi
          exit $missing

      - name: AWS-Credentials (AWS Academy Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bei ECR anmelden
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=sha,prefix=,format=long

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und nach ECR pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Platzhalter in Task-Definition ersetzen
        env:
          RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
          DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -e "s|__AWS_ACCOUNT_ID__|$ACCOUNT_ID|g" \
              -e "s|__AWS_REGION__|$AWS_REGION|g" \
              -e "s|__RDS_ENDPOINT__|$RDS_ENDPOINT|g" \
              -e "s|__DB_SECRET_ARN__|$DB_SECRET_ARN|g" \
              task-definition.json > task-definition.rendered.json

      - name: Neues Image in Task-Definition eintragen
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.rendered.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Soll-Anzahl Tasks sicherstellen
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --desired-count "$ECS_DESIRED_COUNT" > /dev/null

      - name: ECS-Service aktualisieren (Rolling Deployment)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke-Test über den Load Balancer
        if: vars.ALB_DNS != ''
        env:
          ALB_DNS: ${{ vars.ALB_DNS }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "http://$ALB_DNS/actuator/info" 2>/dev/null | grep -q "$GITHUB_SHA" \
               && curl -fsS "http://$ALB_DNS/actuator/health" | grep -q '"status":"UP"'; then
              echo "Version $GITHUB_SHA antwortet über den ALB und ist gesund."
              curl -fsS "http://$ALB_DNS/v1/trips" > /dev/null
              exit 0
            fi
            sleep 10
          done
          echo "::error::Über http://$ALB_DNS antwortet nach 4 Minuten nicht die neue Version $GITHUB_SHA."
          exit 1

      - name: Zusammenfassung
        env:
          ALB_DNS: ${{ vars.ALB_DNS }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ECS-Deploy erfolgreich"
            echo "- Cluster/Service: \`$ECS_CLUSTER\` / \`$ECS_SERVICE\` ($ECS_DESIRED_COUNT Tasks)"
            echo "- URL: http://$ALB_DNS/actuator/info"
            echo "- ECR-Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hinweis bei Fehler
        if: failure()
        run: |
          echo "::error::ECS-Deploy fehlgeschlagen. Häufigste Ursache im Learner Lab: abgelaufene Session -> AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY und AWS_SESSION_TOKEN neu setzen (siehe docs/loesung/README.md). Sonst: Task-Logs in CloudWatch /ecs/biztrips-backend prüfen."
