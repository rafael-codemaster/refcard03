management.endpoint.health.show-details=always

# /actuator/info zeigt, welche Version (Commit-SHA) gerade läuft -> Nachweis "Änderung -> Wirkung"
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=biztrips-backend
info.app.maintainer=rafael-codemaster
info.app.version=${APP_VERSION:dev}

# EX-04: Ablageort für Mitarbeiterfotos, überschreibbar per Umgebungsvariable APP_STORAGE_LOCATION
app.storage.location=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
